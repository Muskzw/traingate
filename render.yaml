# Render blueprint — free tier.
#
# Note the free tier has no persistent disk: the SQLite database and any
# uploaded decks are wiped on every deploy and on restart after idle. That is
# why SEED_DEMO is on — the demo course rebuilds itself on each boot.
#
# Deploy: push this repo to GitHub, then Render → New → Blueprint → pick the repo.

services:
  - type: web
    name: traingate
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Rebuilds the demo company + course on every boot, since the disk resets.
      - key: SEED_DEMO
        value: "true"

      # Set in the Render dashboard once a client has funded the key.
      # Course generation stays disabled until this exists.
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_EFFORT
        value: medium

      # Generated by Render, not stored in the repo.
      - key: PLATFORM_ADMIN_EMAIL
        value: admin@traingate.local
      - key: PLATFORM_ADMIN_PASSWORD
        generateValue: true

      # Used when printing certificate verification links.
      - key: PUBLIC_URL
        sync: false
